name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version tag: $VERSION"
            exit 1
          fi
          RELEASE_VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"
          echo "Release version: ${RELEASE_VERSION}"

      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Build core binary
      - name: Setup Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add x86_64-unknown-linux-musl --toolchain 1.88.0

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Sync core crate version from tag
        run: |
          set -euo pipefail
          CORE_TOML="dayshield-core/Cargo.toml"
          sed -i -E "s/^version = \"[^\"]+\"/version = \"${{ steps.version.outputs.RELEASE_VERSION }}\"/" "$CORE_TOML"
          grep -E '^version = ' "$CORE_TOML"

      - name: Build core binary
        run: |
          cargo +1.88.0 build --release -p dayshield-core --target x86_64-unknown-linux-musl
          mkdir -p release-artifacts
          cp target/x86_64-unknown-linux-musl/release/dayshield-core release-artifacts/

      - name: Package core artifact
        run: |
          cp scripts/ostree-update.sh release-artifacts/
          cd release-artifacts
          tar --zstd -cf core-${{ steps.version.outputs.VERSION }}.tar.zst dayshield-core ostree-update.sh
          ls -lh core-*.tar.zst

      # Generate checksums
      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum core-*.tar.zst > checksums.txt
          cat checksums.txt

      # Create or update GitHub Release with artifacts
      - name: Create or update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-artifacts/core-*.tar.zst release-artifacts/checksums.txt --clobber
          else
            gh release create "$TAG_NAME" --title "DayShield Core $TAG_NAME" --generate-notes
            gh release upload "$TAG_NAME" release-artifacts/core-*.tar.zst release-artifacts/checksums.txt --clobber
          fi

